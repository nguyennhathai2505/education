<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>Bản Việt — Hệ sinh thái Giáo dục &amp; Công nghệ</title>
    <meta name="description" content="Công ty TNHH Đầu tư Giáo dục và Công nghệ Bản Việt — hệ sinh thái 4 thương hiệu: Điểm 10+, DanhLingo, Aitechco, Schooli." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root{
        color-scheme: light;
        --bg:#F6F8FC; --surface:#FFFFFF; --border:#DCE4EF;
        --navy:#07204A; --navy2:#0B2C5C; --blue:#1565D8; --sky:#EAF2FD;
        --gold:#FFB703; --ink:#16233A; --slate:#5A6B84;
        --radius:6px;
      }
      *{box-sizing:border-box}
      html{scroll-behavior:smooth}
      body{margin:0;font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55}
      img{max-width:100%}
      a{color:inherit}
      .wrap{max-width:1200px;margin:0 auto;padding-left:16px;padding-right:16px}
      @keyframes bvFade{from{opacity:0}to{opacity:1}}
      .fade-in{animation:bvFade .35s ease both}
      @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}.fade-in{animation:none}}

      /* ---------- Banner + menu bar ---------- */
      .banner{position:relative;overflow:hidden;background:var(--navy)}
      .banner>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
      .banner .shade{position:absolute;inset:0;background:linear-gradient(to right,rgba(7,32,74,.95),rgba(7,32,74,.78) 55%,rgba(7,32,74,.35))}
      .banner .inner{position:relative;display:flex;align-items:center;padding-top:28px;padding-bottom:28px}
      .banner a.brand{display:flex;align-items:center;gap:16px;text-decoration:none}
      .logo-plate{display:inline-block;background:#fff;border-radius:6px;padding:8px 12px;box-shadow:0 1px 4px rgba(0,0,0,.25);flex-shrink:0}
      .logo-plate img{height:48px;width:auto;display:block}
      .banner .company{color:#fff;line-height:1.35}
      .banner .company .name{font-weight:700;font-size:15px}
      .banner .company .tag{margin-top:4px;font-size:14px;font-weight:500;color:rgba(255,255,255,.8)}
      @media (max-width:767px){.banner .company{display:none}.logo-plate img{height:44px}}
      @media (min-width:640px){.banner .inner{padding-top:40px;padding-bottom:40px}.logo-plate img{height:64px}}

      .menubar{position:sticky;top:0;z-index:60;background:var(--navy);box-shadow:0 2px 10px rgba(7,32,74,.35)}
      .menubar .row{display:flex;align-items:center;justify-content:space-between}
      .menubar ul.main{display:none;list-style:none;margin:0;padding:0;align-items:stretch}
      @media (min-width:1024px){.menubar ul.main{display:flex}}
      .menubar ul.main>li{display:flex;position:relative}
      .navitem{display:flex;align-items:center;gap:6px;padding:14px 16px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;text-decoration:none;background:none;border:0;cursor:pointer;font-family:inherit;transition:background .15s,color .15s}
      .navitem:hover{background:rgba(255,255,255,.1);color:var(--gold)}
      .navitem.active{background:rgba(255,255,255,.1);color:var(--gold)}
      .navitem .caret{font-size:10px;transition:transform .2s}
      .navitem .caret.open{transform:rotate(180deg)}
      .dropdown{position:absolute;left:0;top:100%;z-index:70;width:320px;background:#fff;border:1px solid var(--border);box-shadow:0 10px 30px rgba(7,32,74,.18);padding:8px 0}
      .dropdown a{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;text-decoration:none}
      .dropdown a:hover{background:var(--sky)}
      .dropdown a.head{font-weight:700;color:var(--navy)}
      .dropdown .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:6px}
      .dropdown .bname{display:block;font-weight:600;color:var(--ink)}
      .dropdown .btag{display:block;font-size:13px;color:var(--slate)}
      .menubar .menu-label{padding:12px 0;font-size:13px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#fff}
      @media (min-width:1024px){.menubar .menu-label{display:none}}
      .burger{display:flex;width:40px;height:40px;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.4);border-radius:6px;background:none;color:#fff;font-size:18px;cursor:pointer}
      @media (min-width:1024px){.burger{display:none}}
      .mobile-menu{border-top:1px solid rgba(255,255,255,.15);background:var(--navy)}
      .mobile-menu ul{list-style:none;margin:0;padding:8px 0}
      .mobile-menu a{display:block;padding:12px 4px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.1)}
      .mobile-menu a.active{color:var(--gold)}
      .mobile-menu .sub{list-style:none;margin:0;padding:4px 0 4px 16px}
      .mobile-menu .sub a{display:flex;align-items:center;gap:8px;padding:8px 4px;font-size:15px;font-weight:500;text-transform:none;letter-spacing:0;border-bottom:0}
      .mobile-menu .sub .dot{width:8px;height:8px;border-radius:50%}

      /* ---------- Buttons ---------- */
      .btn{display:inline-block;border-radius:6px;background:var(--navy);color:#fff;padding:12px 24px;font-weight:700;font-size:16px;text-decoration:none;border:2px solid var(--navy);cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s,color .15s;text-align:center}
      .btn:hover{background:var(--blue);border-color:var(--blue)}
      .btn.blue{background:var(--blue);border-color:var(--blue)}
      .btn.blue:hover{background:var(--navy);border-color:var(--navy)}
      .btn-outline{display:inline-block;border-radius:6px;background:#fff;color:var(--navy);padding:11px 24px;font-weight:700;font-size:16px;text-decoration:none;border:2px solid var(--navy);cursor:pointer;font-family:inherit;transition:background .15s,color .15s;text-align:center}
      .btn-outline:hover{background:var(--navy);color:#fff}
      .btn-outline.on-dark{background:transparent;color:#fff;border-color:rgba(255,255,255,.75)}
      .btn-outline.on-dark:hover{background:rgba(255,255,255,.12);color:#fff}
      .btn-sm{padding:9px 16px;font-size:15px}
      .btn-brand{display:inline-block;border-radius:6px;padding:9px 16px;font-weight:700;font-size:15px;text-decoration:none;border:2px solid;cursor:pointer;font-family:inherit;background:#fff;transition:background .15s;text-align:center}
      .btn-brand:hover{background:var(--sky)}
      .btn-brand-solid{display:inline-block;border-radius:6px;padding:10px 16px;font-weight:700;font-size:15px;text-decoration:none;border:0;cursor:pointer;font-family:inherit;color:#fff;transition:opacity .15s;text-align:center}
      .btn-brand-solid:hover{opacity:.9}
      button:disabled{opacity:.6;cursor:wait}

      /* ---------- Sections & titles ---------- */
      .section{padding:48px 0}
      .section.white{background:#fff;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
      .kicker{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.18em;color:var(--blue);margin:0}
      .sec-title{margin:6px 0 0;font-size:28px;font-weight:800;letter-spacing:-.01em;color:var(--navy);line-height:1.25}
      @media (min-width:640px){.sec-title{font-size:34px}}
      .gold-rule{display:block;width:64px;height:3px;background:var(--gold);margin-top:12px}
      .sec-sub{margin:12px 0 0;font-size:16px;line-height:1.65;color:var(--slate);max-width:768px}
      .page-hero{background:var(--navy);color:#fff}
      .page-hero .inner{padding-top:36px;padding-bottom:36px}
      @media (min-width:640px){.page-hero .inner{padding-top:44px;padding-bottom:44px}}
      .page-hero h1{margin:0;max-width:768px;font-size:30px;font-weight:800;line-height:1.25}
      @media (min-width:640px){.page-hero h1{font-size:42px}}
      .page-hero p{margin:12px 0 0;max-width:672px;font-size:17px;line-height:1.65;color:rgba(255,255,255,.85)}

      .breadcrumb{padding-top:20px}
      .breadcrumb ol{display:flex;flex-wrap:wrap;align-items:center;gap:6px;list-style:none;margin:0;padding:0;font-size:14px;color:var(--slate)}
      .breadcrumb a{font-weight:500;text-decoration:none}
      .breadcrumb a:hover{color:var(--blue)}
      .breadcrumb .cur{font-weight:600;color:var(--ink)}

      /* ---------- Home intro ---------- */
      .intro-grid{display:grid;gap:36px;align-items:center}
      @media (min-width:1024px){.intro-grid{grid-template-columns:1fr 1fr}}
      .intro h1{margin:10px 0 0;font-size:34px;font-weight:900;line-height:1.2;color:var(--navy)}
      @media (min-width:640px){.intro h1{font-size:42px}}
      .intro .lead{margin:16px 0 0;font-size:17px;line-height:1.7;color:var(--ink)}
      .intro .cta-row{margin-top:24px;display:flex;flex-wrap:wrap;gap:12px}
      .intro img.photo{width:100%;height:288px;object-fit:cover;border-radius:8px;box-shadow:0 1px 4px rgba(7,32,74,.15)}
      @media (min-width:640px){.intro img.photo{height:320px}}

      .finder{margin-top:40px;border:1px solid var(--border);background:var(--bg);padding:16px 20px}
      .finder .row{display:flex;flex-direction:column;gap:12px}
      @media (min-width:768px){.finder .row{flex-direction:row;align-items:center}}
      .finder label{flex-shrink:0;font-size:16px;font-weight:800;color:var(--navy)}
      .finder select{flex:1;width:100%}

      /* ---------- Infographic số thứ tự ---------- */
      .numstats{display:grid;gap:36px 32px}
      @media (min-width:640px){.numstats{grid-template-columns:1fr 1fr}.numstats.c3{grid-template-columns:repeat(3,1fr)}}
      @media (min-width:1024px){.numstats{grid-template-columns:repeat(4,1fr)}.numstats.c3{grid-template-columns:repeat(3,1fr)}}
      .numstat{border-top:3px solid var(--navy);padding-top:16px}
      .numstat .no{font-size:14px;font-weight:900;letter-spacing:.2em;color:var(--blue)}
      .numstat .val{margin-top:6px;font-size:34px;font-weight:900;line-height:1;color:var(--navy)}
      @media (min-width:640px){.numstat .val{font-size:36px}}
      .numstat .lab{margin-top:10px;font-weight:700;color:var(--ink)}
      .numstat .sub{margin-top:4px;font-size:14px;line-height:1.6;color:var(--slate)}

      /* ---------- Cards ---------- */
      .grid{display:grid;gap:20px}
      @media (min-width:640px){.grid.g2{grid-template-columns:1fr 1fr}.grid.g4{grid-template-columns:1fr 1fr}}
      @media (min-width:1024px){.grid.g3{grid-template-columns:repeat(3,1fr)}.grid.g4{grid-template-columns:repeat(4,1fr)}}
      .card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(7,32,74,.06)}
      .card .body{display:flex;flex:1;flex-direction:column;padding:20px}
      .card img.cover{width:100%;height:176px;object-fit:cover;display:block}
      .logo-strip{display:flex;align-items:center;padding:12px 20px;background:#fff}
      .logo-strip img{height:36px;width:auto;max-width:100%;object-fit:contain}
      .logo-strip.tall img{height:44px}
      .field{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin:0}
      .card h3{margin:4px 0 0;font-size:22px;font-weight:800;color:var(--navy)}
      .card h3 a{text-decoration:none}
      .card h3 a:hover{text-decoration:underline}
      .card .tagline{margin-top:2px;font-weight:600;color:var(--slate)}
      .check-list{list-style:none;margin:14px 0 0;padding:0}
      .check-list li{display:flex;gap:8px;font-size:15px;line-height:1.6;color:var(--ink);margin-top:8px}
      .check-list li:first-child{margin-top:0}
      .card .actions{margin-top:auto;padding-top:20px;display:flex;flex-wrap:wrap;gap:8px}
      .badge{display:inline-block;border-radius:4px;padding:2px 10px;font-size:13px;font-weight:700;background:var(--sky);color:var(--blue)}
      .meta{font-size:13px;font-weight:600;color:var(--slate);display:flex;align-items:center;gap:8px;margin:0}
      .card .title-link{font-size:18px;font-weight:700;line-height:1.4;color:var(--navy);text-decoration:none}
      .card .title-link:hover{text-decoration:underline}
      .card .excerpt{margin-top:8px;flex:1;font-size:15px;line-height:1.65;color:var(--slate)}
      .read-more{margin-top:16px;font-weight:700;color:var(--blue);text-decoration:none}
      .read-more:hover{text-decoration:underline}

      .need-card{display:flex;flex-direction:column;border:1px solid var(--border);background:var(--bg);padding:24px}
      .need-card h3{margin:0;font-size:20px;font-weight:800;color:var(--navy)}
      .need-card p{margin-top:8px;flex:1;line-height:1.65;color:var(--slate)}
      .need-card .btn-brand{align-self:flex-start;margin-top:20px}

      .strength{display:flex;gap:16px}
      .strength .no{font-size:26px;font-weight:900;line-height:1;color:var(--blue)}
      .strength h3{margin:0;font-size:18px;font-weight:800;color:var(--navy);line-height:1.35}
      .strength p{margin:6px 0 0;line-height:1.65;color:var(--slate)}
      .note-bar{margin-top:36px;border-left:3px solid var(--gold);background:var(--bg);padding:16px 20px;line-height:1.65;color:var(--ink)}

      .partner{border:1px solid var(--border);background:#fff;padding:24px;text-align:center}
      .partner .pname{font-size:30px;font-weight:900;letter-spacing:-.01em;color:var(--navy);margin:0}
      .partner .prole{margin-top:4px;font-weight:700;color:var(--blue)}
      .partner p.desc{margin-top:10px;line-height:1.65;color:var(--slate)}

      /* ---------- Forms ---------- */
      .field-input{width:100%;border-radius:6px;border:1px solid var(--border);background:#fff;padding:10px 14px;font-size:15px;color:var(--ink);outline:none;font-family:inherit;transition:border-color .15s, box-shadow .15s}
      .field-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,101,216,.18)}
      .flabel{display:block;margin-bottom:6px;font-size:14px;font-weight:700;color:var(--navy)}
      .form-grid{display:grid;gap:16px}
      @media (min-width:640px){.form-grid{grid-template-columns:1fr 1fr}.form-grid .span2{grid-column:span 2}}
      .form-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(7,32,74,.06)}
      @media (min-width:640px){.form-box{padding:28px}}
      .form-note{margin-top:12px;text-align:center;font-size:13px;color:var(--slate)}
      .alert-error{margin-top:16px;border-radius:6px;background:#FDECEC;padding:12px 16px;font-size:15px;font-weight:600;color:#B3261E}
      .success-box{border:1px solid #BFE8D8;background:#EFFAF4;border-radius:8px;padding:24px;text-align:center}
      .success-box .tick{font-size:36px;color:#137333;margin:0}
      .success-box h3{margin:8px 0 0;font-size:20px;font-weight:800;color:var(--navy)}
      .success-box p{margin:8px auto 0;max-width:448px;font-size:15px;line-height:1.65;color:var(--ink)}
      .submit-btn{width:100%;margin-top:20px;padding:14px;font-size:18px}

      .chip{border-radius:6px;border:2px solid var(--border);background:#fff;color:var(--ink);padding:8px 16px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s,background .15s}
      .chip:hover{border-color:var(--blue);color:var(--blue)}
      .chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
      .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
      .filter-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:20px;box-shadow:0 1px 3px rgba(7,32,74,.06)}
      .filter-box .fl{font-weight:700;color:var(--navy);margin:0}
      .count-line{margin-top:28px;font-weight:600;color:var(--slate)}
      .empty-box{margin-top:16px;border:1px dashed var(--border);border-radius:8px;background:#fff;padding:40px;text-align:center}
      .empty-box h3{margin:0;font-size:18px;font-weight:700;color:var(--navy)}
      .empty-box p{margin-top:8px;color:var(--slate)}

      /* ---------- Brand detail ---------- */
      .brand-hero{color:#fff;margin-top:0}
      .brand-hero .inner{padding-top:40px;padding-bottom:40px}
      @media (min-width:640px){.brand-hero .inner{padding-top:56px;padding-bottom:56px}}
      .brand-hero .fieldline{margin-top:24px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.8);font-size:14px}
      .brand-hero h1{margin:8px 0 0;font-size:36px;font-weight:900;line-height:1.15}
      @media (min-width:640px){.brand-hero h1{font-size:48px}}
      .brand-hero .tagline{margin-top:8px;font-size:20px;font-weight:600;color:rgba(255,255,255,.9)}
      .brand-hero .cta-row{margin-top:24px;display:flex;flex-wrap:wrap;gap:12px}
      .brand-hero .logo-on-color{height:56px;width:auto;max-width:100%;object-fit:contain}
      @media (min-width:640px){.brand-hero .logo-on-color{height:64px}}
      .info-box{margin-top:24px;border-radius:8px;background:var(--sky);padding:20px;font-size:15px;line-height:1.65}
      .info-box a{font-weight:600;color:var(--blue);text-decoration:none}
      .info-box a:hover{text-decoration:underline}
      .slogan-band{margin-top:48px;border-radius:8px;padding:24px;text-align:center;color:#fff}
      @media (min-width:640px){.slogan-band{padding:32px}}
      .slogan-band .big{font-size:24px;font-weight:900;letter-spacing:.04em;margin:0}
      @media (min-width:640px){.slogan-band .big{font-size:30px}}
      .slogan-band p.sub{margin:12px auto 0;max-width:672px;color:rgba(255,255,255,.9);line-height:1.65}
      .panel{border:1px solid var(--border);background:#fff;padding:24px}
      @media (min-width:640px){.panel{padding:32px}}
      .panel h2{margin:0;font-size:24px;font-weight:800;color:var(--navy)}

      .detail-grid{display:grid;gap:36px;align-items:start}
      @media (min-width:1024px){.detail-grid{grid-template-columns:1fr 1fr}}
      .detail-grid img.photo{width:100%;height:288px;object-fit:cover;border-radius:8px;box-shadow:0 1px 4px rgba(7,32,74,.15)}
      @media (min-width:640px){.detail-grid img.photo{height:384px}}
      .detail-grid h2,.detail-grid h1{color:var(--navy)}
      .spec-box{display:grid;gap:12px;border-radius:8px;background:var(--sky);padding:20px;font-size:15px;margin-top:20px}
      @media (min-width:640px){.spec-box{grid-template-columns:repeat(3,1fr)}}
      .spec-box dt{font-weight:700;color:var(--slate)}
      .spec-box dd{margin:2px 0 0;font-weight:600;color:var(--ink)}

      /* ---------- News layout w/ sidebar ---------- */
      .news-layout{display:grid;gap:40px}
      @media (min-width:1024px){.news-layout{grid-template-columns:1fr 300px}}
      .side-box{border:1px solid var(--border);background:#fff;padding:20px}
      .side-box h2{margin:0;font-size:16px;font-weight:800;color:var(--navy)}
      .side-box ul{list-style:none;margin:14px 0 0;padding:0}
      .side-box li{margin-top:16px}
      .side-box li:first-child{margin-top:0}
      .side-box li a{font-weight:600;line-height:1.45;color:var(--ink);text-decoration:none}
      .side-box li a:hover{color:var(--blue);text-decoration:underline}
      .side-box li p{margin:2px 0 0;font-size:13px;color:var(--slate)}
      .side-cta{background:var(--navy);padding:20px;color:#fff}
      .side-cta h2{margin:0;font-size:16px;font-weight:800}
      .side-cta p{margin-top:8px;font-size:15px;line-height:1.65;color:rgba(255,255,255,.85)}
      .side-stack{display:flex;flex-direction:column;gap:24px}
      .cat-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
      .cat-list .chip{text-align:left}
      .mobile-cats{margin-bottom:8px}
      @media (min-width:1024px){.mobile-cats{display:none}.desktop-only{display:block}}
      .desktop-only{display:none}
      article.post h1{margin:12px 0 0;font-size:30px;font-weight:800;line-height:1.3;color:var(--navy)}
      @media (min-width:640px){article.post h1{font-size:36px}}
      article.post img.hero{margin-top:24px;width:100%;height:288px;object-fit:cover;border-radius:8px}
      @media (min-width:640px){article.post img.hero{height:384px}}
      article.post .excerpt{margin-top:24px;font-size:18px;font-weight:500;line-height:1.7;color:var(--ink)}
      article.post .para{margin-top:16px;font-size:17px;line-height:1.75;color:var(--ink)}
      .post-cta{margin-top:36px;border:1px solid var(--border);background:rgba(234,242,253,.6);padding:24px;text-align:center}
      .post-cta p{margin:0;font-size:18px;font-weight:800;color:var(--navy)}

      /* ---------- Timeline ---------- */
      .timeline{position:relative;max-width:768px;margin:40px auto 0;list-style:none;padding:0 0 0 32px;border-left:2px solid var(--border)}

/* ---------- Helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function img(key){return IMG[key]||IMG.hero;}
function brandOf(slug){for(var i=0;i<BRANDS.length;i++)if(BRANDS[i].slug===slug)return BRANDS[i];return null;}
function courseOf(slug){for(var i=0;i<COURSES.length;i++)if(COURSES[i].slug===slug)return COURSES[i];return null;}
function campusOf(id){for(var i=0;i<CAMPUSES.length;i++)if(CAMPUSES[i].id===id)return CAMPUSES[i];return null;}
function brandName(slug){if(slug==="hop-tac")return "Hợp tác";var b=brandOf(slug);return b?b.name:slug;}
function brandColor(slug){var b=brandOf(slug);return b?b.color:(BRAND_FALLBACK_COLOR[slug]||"#1565D8");}
function telHref(phone){return "tel:"+String(phone).replace(/[\s.]/g,"");}
function fmtDate(iso){var p=String(iso).slice(0,10).split("-");return p.length===3?(p[2]+"/"+p[1]+"/"+p[0]):iso;}
function fmtDateTime(iso){var d=new Date(iso);if(isNaN(d.getTime()))return iso;return d.toLocaleString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function navigate(path){menuOpen=false;ecoOpen=false;if(("#"+path)===location.hash){render();}else{location.hash=path;}}
function goConsult(brandSlug,courseSlug){var q=[];if(brandSlug)q.push("brand="+encodeURIComponent(brandSlug));if(courseSlug)q.push("course="+encodeURIComponent(courseSlug));navigate("/lien-he"+(q.length?"?"+q.join("&"):""));}
function parseRoute(){
  var raw=location.hash.replace(/^#\/?/,"");
  var qi=raw.indexOf("?");var path=qi>=0?raw.slice(0,qi):raw;
  var query=new URLSearchParams(qi>=0?raw.slice(qi+1):"");
  var parts=path.split("/");var page=parts[0]||"home";var param=parts[1]?decodeURIComponent(parts[1]):"";
  return {page:page,param:param,query:query,path:path};
}

/* ---------- Lưu trữ đăng ký tại trình duyệt (bản xuất tĩnh) ---------- */
var LS_KEY = "banviet_registrations_v1";
var memRegs = null; /* dự phòng khi localStorage không khả dụng */
function loadRegs(){
  if (memRegs) return memRegs.slice();
  try {
    var raw = localStorage.getItem(LS_KEY);
    var arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function saveRegs(arr){
  memRegs = arr.slice();
  try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); } catch (e) { /* vẫn giữ trong bộ nhớ phiên */ }
}
function addReg(reg){
  var arr = loadRegs();
  var maxId = 0;
  arr.forEach(function(r){ if (r.id > maxId) maxId = r.id; });
  reg.id = maxId + 1;
  reg.createdAt = new Date().toISOString();
  reg.status = "new";
  arr.unshift(reg);
  saveRegs(arr);
  return reg;
}
function setRegStatus(id, status){
  var arr = loadRegs();
  arr.forEach(function(r){ if (r.id === id) r.status = status; });
  saveRegs(arr);
}

function refreshFormOptions(form){
  var brandSlug = form.querySelector(".f-brand").value;
  var courseSel = form.querySelector(".f-course");
  var campusSel = form.querySelector(".f-campus");
  var courseWrap = form.querySelector(".f-course-wrap");
  var campusWrap = form.querySelector(".f-campus-wrap");
  var partnership = brandSlug === "hop-tac";
  courseWrap.style.display = partnership ? "none" : "";
  var bc = COURSES.filter(function(c){ return c.brandSlug === brandSlug; });
  var wantCourse = form.getAttribute("data-course") || "";
  courseSel.innerHTML = '<option value="">— Chưa chọn / cần tư vấn —</option>' + bc.map(function(c){
    return '<option value="' + c.slug + '"' + (c.slug === wantCourse ? " selected" : "") + ">" + esc(c.title) + "</option>";
  }).join("");
  var bk = CAMPUSES.filter(function(c){ return c.brandSlug === brandSlug; });
  campusWrap.style.display = (!partnership && bk.length > 0) ? "" : "none";
  campusSel.innerHTML = '<option value="">— Chưa chọn —</option>' + bk.map(function(c){
    return '<option value="' + c.id + '">' + esc(c.name) + "</option>";
  }).join("");
}
function initConsultForms(){
  var forms = document.querySelectorAll("form.consult-form");
  Array.prototype.forEach.call(forms, function(form){
    refreshFormOptions(form);
    form.querySelector(".f-brand").addEventListener("change", function(){
      form.setAttribute("data-course", "");
      refreshFormOptions(form);
    });
    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      var err = form.querySelector(".f-error");
      function fail(msg){ err.textContent = msg; err.style.display = "block"; }
      err.style.display = "none";
      var fullName = form.querySelector(".f-name").value.trim();
      var phone = form.querySelector(".f-phone").value.trim();
      var email = form.querySelector(".f-email").value.trim();
      var brandSlug = form.querySelector(".f-brand").value;
      var courseSlug = brandSlug === "hop-tac" ? "" : form.querySelector(".f-course").value;
      var campusVal = form.querySelector(".f-campus").value;
      var studyTime = form.querySelector(".f-time").value;
      var note = form.querySelector(".f-note").value.trim();
      if (fullName.length < 2) return fail("Vui lòng nhập họ tên (ít nhất 2 ký tự).");
      var digits = phone.replace(/[\s.]/g, "");
      if (!/^0\d{8,10}$/.test(digits)) return fail("Số điện thoại chưa đúng định dạng (bắt đầu bằng 0, 9–11 số).");
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail("Email chưa đúng định dạng.");
      var reg = addReg({
        fullName: fullName, phone: phone, email: email, brandSlug: brandSlug,
        courseSlug: courseSlug, campusId: campusVal ? Number(campusVal) : null,
        studyTime: studyTime, note: note
      });
      var bName = brandSlug === "hop-tac" ? "Hợp tác cùng Bản Việt" : brandName(brandSlug);
      var cObj = courseSlug ? courseOf(courseSlug) : null;
      var box = document.createElement("div");
      box.className = "success-box fade-in";
      box.setAttribute("role", "status");
      box.innerHTML = '<p class="tick" aria-hidden="true">✓</p><h3>Cảm ơn ' + esc(fullName) + "!</h3>" +
        "<p>Đăng ký tư vấn <strong>" + esc(bName) + "</strong>" + (cObj ? " — khóa <strong>" + esc(cObj.title) + "</strong>" : "") +
        " đã được ghi nhận (mã #" + reg.id + "). Đội ngũ Bản Việt sẽ liên hệ tới số <strong>" + esc(phone) + "</strong> trong giờ làm việc.</p>" +
        '<button type="button" class="btn" style="margin-top:20px" onclick="render()">Gửi thêm đăng ký khác</button>';
      var parent = form.parentNode;
      parent.replaceChild(box, form);
      box.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  });
}

      '<div class="stat-card"><h2>Đăng ký theo thương hiệu</h2>' + (byBrandData.length ? hbarHTML(byBrandData, "lead") : '<p style="margin-top:16px;font-size:15px;color:var(--slate)">Chưa có đăng ký nào.</p>') + "</div>" +
      '<div class="stat-card"><h2>Đăng ký theo trạng thái</h2>' + (byStatusData.length ? hbarHTML(byStatusData, "lead") : '<p style="margin-top:16px;font-size:15px;color:var(--slate)">Chưa có đăng ký nào.</p>') + (timeLine ? '<p style="margin-top:16px;font-size:14px;color:var(--slate)">Thời gian học: ' + esc(timeLine) + "</p>" : "") + "</div>" +
    "</section>" +
    '<section class="filter-box" style="margin-top:32px"><div class="form-grid" style="grid-template-columns:1fr">' +
      '<div><label class="flabel" for="adm-search">Tìm theo tên hoặc SĐT</label><input class="field-input" id="adm-search" placeholder="Ví dụ: Nguyễn hoặc 0909…" value="' + esc(adminState.search) + '" /></div>' +
      '<div><label class="flabel" for="adm-brand">Thương hiệu</label><select class="field-input" id="adm-brand">' + brandOpts + "</select></div>" +
      '<div><label class="flabel" for="adm-status">Trạng thái</label><select class="field-input" id="adm-status">' + statusOpts + "</select></div>" +
    "</div></section>" +
    '<p class="count-line" role="status">Hiển thị ' + regs.length + " đăng ký</p>" + listHTML +
  "</div></main>";
}

/* ================= 404 ================= */
function notFoundPage(){
  return '<main><div class="wrap notfound"><p class="code">404</p><h1 style="margin-top:12px;font-size:24px;font-weight:800;color:var(--navy)">Trang không tồn tại</h1><p style="margin-top:12px;color:var(--slate)">Đường dẫn này không thuộc website Bản Việt. Quay về trang chủ để tiếp tục khám phá hệ sinh thái.</p><a class="btn" style="margin-top:28px" href="#/home">Về trang chủ</a></div></main>';
}

/* ================= Router & khởi tạo ================= */
var routeKey = "";
function render(){
  var r = parseRoute();
  var key = r.path + "?" + r.query.toString();
  var samePage = key === routeKey;
  routeKey = key;
  var main = "";
  switch (r.page) {
    case "home": main = homePage(); break;
    case "gioi-thieu": main = aboutPage(); break;
    case "he-sinh-thai": main = ecosystemPage(); break;
    case "thuong-hieu": { var b = brandOf(r.param); main = b ? brandDetailPage(b) : notFoundPage(); break; }
    case "khoa-hoc": {
      if (!samePage) {
        var init = r.query.toString();
        courseState = { brand: "all", audience: "all" };
        if (BRANDS.some(function(x){ return x.slug === init; })) courseState.brand = init;
        else if (AUDIENCE_FILTERS.some(function(x){ return x.v === init; })) courseState.audience = init;
      }
      main = coursesPage(); break;
    }
    case "khoa-hoc-chi-tiet": { var c = courseOf(r.param); main = c ? courseDetailPage(c) : notFoundPage(); break; }
    case "tin-tuc": main = newsListPage(); break;
    case "bai-viet": { var n = null; NEWS.forEach(function(x){ if (x.slug === r.param) n = x; }); main = newsArticlePage(n); break; }
    case "lien-he": main = contactPage(r.query); break;
    case "quan-tri": main = adminPage(); break;
    default: main = notFoundPage();
  }
  document.getElementById("app").innerHTML = '<div class="fade-in">' + headerHTML(r.page) + main + footerHTML() + "</div>";
  wirePage(r);
  initConsultForms();
  if (!samePage) window.scrollTo(0, 0);
}
function wirePage(r){
  var burger = document.getElementById("burger");
  if (burger) burger.addEventListener("click", function(){ menuOpen = !menuOpen; renderSoft(); });
  var ecoBtn = document.getElementById("eco-btn");
  if (ecoBtn) ecoBtn.addEventListener("click", function(ev){ ev.stopPropagation(); ecoOpen = !ecoOpen; renderSoft(); });
  document.querySelectorAll("[data-nav]").forEach(function(el){
    el.addEventListener("click", function(){ navigate(el.getAttribute("data-nav")); });
  });
  document.querySelectorAll("[data-consult]").forEach(function(el){
    el.addEventListener("click", function(){
      var v = (el.getAttribute("data-consult") || "").split("|");
      goConsult(v[0] || undefined, v[1] || undefined);
    });
  });
  document.querySelectorAll("[data-scroll]").forEach(function(el){
    el.addEventListener("click", function(){
      var t = document.getElementById(el.getAttribute("data-scroll"));
      if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  });
  document.querySelectorAll("[data-scroll-footer]").forEach(function(el){
    el.addEventListener("click", function(){
      var f = document.querySelector("footer.site");
      if (f) f.scrollIntoView({ behavior: "smooth" });
    });
  });
  var finderBtn = document.getElementById("finder-btn");
  if (finderBtn) finderBtn.addEventListener("click", function(){
    var sel = document.getElementById("finder");
    var opt = FINDER_OPTIONS[Number(sel.value) || 0];
    if (opt) navigate(opt.hash);
  });
  document.querySelectorAll("[data-cbrand]").forEach(function(el){
    el.addEventListener("click", function(){ courseState.brand = el.getAttribute("data-cbrand"); render(); });
  });
  document.querySelectorAll("[data-caud]").forEach(function(el){
    el.addEventListener("click", function(){ courseState.audience = el.getAttribute("data-caud"); render(); });
  });
  document.querySelectorAll("[data-ncat]").forEach(function(el){
    el.addEventListener("click", function(){ newsState.category = el.getAttribute("data-ncat"); render(); });
  });
  var admSearch = document.getElementById("adm-search");
  if (admSearch) {
    admSearch.addEventListener("input", function(){
      adminState.search = admSearch.value;
      var pos = admSearch.selectionStart;
      render();
      var again = document.getElementById("adm-search");
      if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
    });
    var ab = document.getElementById("adm-brand");
    if (ab) ab.addEventListener("change", function(){ adminState.brand = ab.value; render(); });
    var as = document.getElementById("adm-status");
    if (as) as.addEventListener("change", function(){ adminState.status = as.value; render(); });
  }
  document.querySelectorAll("[data-status-for]").forEach(function(sel){
    sel.addEventListener("change", function(){
      setRegStatus(Number(sel.getAttribute("data-status-for")), sel.value);
      render();
    });
  });
}
function renderSoft(){
  /* Vẽ lại giữ nguyên vị trí cuộn (dùng cho mở/đóng menu) */
  var y = window.scrollY;
  var r = parseRoute();
  var main = document.querySelector("main");
  var mainHTML = main ? main.outerHTML : "";
  void mainHTML;
  render();
  window.scrollTo(0, y);
}
document.addEventListener("click", function(ev){
  if (ecoOpen) {
    var dd = document.getElementById("eco-dropdown");
    var btn = document.getElementById("eco-btn");
    if (dd && !dd.contains(ev.target) && btn && !btn.contains(ev.target)) { ecoOpen = false; renderSoft(); }
  }
});
window.addEventListener("hashchange", function(){ menuOpen = false; ecoOpen = false; render(); });
if (!location.hash) location.hash = "/home";
render();
</script>
